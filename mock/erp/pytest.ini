[pytest]
testpaths = tests

# 让 `import app.*` 解析到 mock/erp/app —— 注意这个 `app` 和主服务的
# `backend/app` **同名但完全是两个包**。
#
# 这就是本文件存在的首要理由：两套测试绝不能共用**一次** pytest 运行。
# 根目录的 pytest.ini 写着 `pythonpath = backend`；一旦这样跑：
#     python -m pytest tests mock/erp        # ← 别这么干
# 两次收集共用一个 rootdir 和一份 ini，`import app` 只会指向 backend/app，
# 模拟 ERP 的 conftest 立刻在 `from app.config import settings` 上
# ModuleNotFoundError 炸掉。炸掉是好事 —— 比「静默跑到错的包上、
# 报一堆表不存在」好查得多。分开跑就没这个问题：
#     python -m pytest                       # 主平台（根目录 ini，testpaths=tests）
#     python -m pytest mock/erp              # 模拟 ERP（pytest 会向上找到本文件）
# 第二条从任意目录都行：rootdir 取的是被收集目录往上最近的 ini，而
# `pythonpath` 是相对 **rootdir**（即 mock/erp）解析的，不是相对 cwd。
pythonpath = .

addopts = --strict-markers

asyncio_mode = auto

# 与主服务同样的理由：被测应用在**导入时**就建好了进程级连接池
# （app/database.py 的 engine）。socket 一旦在某个循环里开出来就绑死了，
# 若每个测试换一个新循环，第二个用例就会报 `Event loop is closed`。
# 让所有测试与夹具共用同一个循环。详见 tests/conftest.py 的说明。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    unit: 纯逻辑测试，不连 MySQL，没有数据库也能跑（pytest -m unit）
    integration: 需要真实 MySQL（mock_erp_test），跑前先执行 scripts/init_test_db.sh
