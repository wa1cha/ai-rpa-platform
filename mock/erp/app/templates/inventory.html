{% extends "base.html" %}
{% block title %}库存查询 · 模拟 ERP{% endblock %}

{% block content %}
<h1>库存查询</h1>

<table data-testid="table-inventory">
  <thead>
    <tr>
      <th>商品编码</th>
      <th>可用库存</th>
    </tr>
  </thead>
  <tbody>
  {% for item in items %}
    <tr data-testid="row-inventory-{{ item.sku }}">
      <td>{{ item.sku }}</td>
      <td class="num" data-testid="cell-qty-{{ item.sku }}">{{ item.quantity }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

<p class="hint">SKU-003 的库存为 0 —— 用它才能跑出「库存不足」那条分支。</p>
{% endblock %}
