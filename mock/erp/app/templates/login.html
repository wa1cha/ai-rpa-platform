{% extends "base.html" %}
{% block title %}ERP 登录{% endblock %}

{% block content %}
<section class="card narrow">
  {#- 页面标题是 h1「ERP 登录」：§4.2 里 RPA 用它确认自己确实到了登录页。 -#}
  <h1>ERP 登录</h1>

  <form method="post" action="/login">
    <label for="username">用户名</label>
    <input id="username" type="text" name="username" data-testid="input-username" autocomplete="off">

    <label for="password">密码</label>
    <input id="password" type="password" name="password" data-testid="input-password">

    {% if error %}
    <p class="error" data-testid="msg-login-error">{{ error }}</p>
    {% endif %}

    <button type="submit" data-testid="btn-login">登录</button>
  </form>
</section>
{% endblock %}
