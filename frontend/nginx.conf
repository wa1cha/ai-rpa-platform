# 前端生产入口（替换容器自带的 default.conf）
#
# 职责有二：
#   ① 托管构建产物（SFC 单页应用）
#   ② 把 /api 反代到后端 —— 与开发期 Vite dev server 的 server.proxy 等价，
#      所以后端始终不需要 CORS 中间件。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 一下静态资源，管理后台体积不大但值得
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端是 history 路由：刷新 /orders、/dashboard 这类子路径要回落到 index.html，
    # 否则 nginx 会因为找不到对应文件而 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源可以长缓存（文件名变即 URL 变）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /api 反代到后端。proxy_pass 不带 URI 后缀 —— /api/... 原样转发，
    # 后端路由本就挂在 /api/v1 前缀下，不需要再改写路径。
    #
    # 目标写成变量 + 显式 resolver 是为了**动态解析**：nginx 对 proxy_pass 里
    # 的裸主机名只在启动时解析一次并永久缓存。backend 一旦被重建（`up -d`
    # 换了容器 = 换了 IP），nginx 还在往旧 IP 发，全部 502 Bad Gateway。
    # 用 Docker 内嵌 DNS（127.0.0.11）+ valid=10s，10 秒内自动跟到新地址。
    # proxy_pass 用变量且不带 URI 时，转发的是**原始请求 URI**，路径行为不变。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 失败截图上传可能有几 MB，放宽请求体上限
        client_max_body_size 16m;
    }
}
