[pytest]
testpaths = tests
# 让 `import app.*` 直接可用，省掉每个测试文件自己往 sys.path 里插 backend/。
# 这是 pytest 自带的 ini 选项（7.0+），不需要 conftest 里再写一遍 sys.path。
pythonpath = backend

addopts = --strict-markers

# async 测试函数与 async fixture 都自动识别，不用逐个贴 @pytest.mark.asyncio。
asyncio_mode = auto

# 事件循环 scope —— 两边都钉成 session，整个测试会话共用一个循环。
#
# 先记一下 pytest-asyncio 0.26 的默认值（实测源码，不是猜的）：
#   · asyncio_default_fixture_loop_scope 默认 None
#   · asyncio_default_test_loop_scope    默认 "function"
#
# 为什么不能顺着默认走：本项目的被测应用在**导入时**就建好了进程级的连接池 ——
# `database/redis.py` 的 redis_client、`database/mysql.py` 的 engine。
# 这些池一旦在某个事件循环里开过连接，socket 就绑在那个循环上，再也搬不走。
# 而默认的 function scope 意味着**每个测试一个新循环**：第一个用例连上 Redis 后
# 循环被关掉，第二个用例在新循环里复用旧 socket，直接报
# `RuntimeError: Event loop is closed`。表现为「第一个集成测试过了，后面全崩」。
#
# 所以必须让所有测试与夹具共用**同一个**循环。这也是有进程级连接池的应用
# 跑异步测试的标准配置 —— 是测试侧的生命周期问题，不该去改生产代码
# （给连接池加测试专用分支、把 session 绑到指定 loop 之类都是在给测试擦屁股）。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    unit: 纯逻辑测试，不连 MySQL / Redis，没有外部服务也能跑（pytest -m unit）
    integration: 需要真实 MySQL（ai_rpa_test）与 Redis（db 15），跑前先执行 scripts/init_test_db.sh
