[pytest]
testpaths = tests

# 让 `import rpa.*` 可用。
#
# 这里写 `..` 而不是 `.`，因为**解释 pyproject/ini 里的路径要看 rootdir 是谁**：
# rootdir 取的是「被收集目录往上最近的 ini」，也就是本文件所在的 rpa/，
# 而 `rpa` 这个包在仓库根目录下面 —— 所以要往上一级。
# 对照 mock/erp/pytest.ini：那里写 `.` 就够了，因为那个包的 `app` 就在 mock/erp 下。
#
# 这同时是「两套测试不能共用一次 pytest 运行」的第三个理由（前两个见
# mock/erp/pytest.ini 的长注释）：根目录的 ini 是 `pythonpath = backend`，
# 在那儿跑 `pytest rpa/tests` 会因为 import 不到 `rpa` 而直接收集失败。
# 分开跑就没问题：
#     python -m pytest              # 主平台（根目录 ini，testpaths=tests）
#     python -m pytest mock/erp     # 模拟 ERP（向上找到 mock/erp/pytest.ini）
#     python -m pytest rpa/tests    # RPA Worker（向上找到本文件）
pythonpath = ..

addopts = --strict-markers -m "not e2e"

# 刻意**不设** asyncio_mode / asyncio_default_*_loop_scope。
#
# 这里的测试全是同步的（Playwright 的同步 API 不能在事件循环里跑），
# 没有任何 async 测试或 async fixture，所以不需要给 pytest-asyncio 配任何东西 ——
# 它在 strict 模式下对纯同步套件完全不插手，也就不存在「给每个用例建一个事件循环」
# 的风险。这正是本套件必须独立于根目录那个 conftest 的原因：根 conftest 里有
# 一个 autouse 的 **async** 夹具，一旦被收集进来就会强行拉起事件循环。
# 详见 tests/conftest.py（本目录那个）的说明。

markers =
    unit: 纯逻辑测试。不碰浏览器、不连任何服务，秒级跑完（pytest -m unit）
    e2e: 端到端测试。需要主平台 + 模拟 ERP 都活着、且本机装了 Chromium。
         默认被 addopts 里的 `-m "not e2e"` 跳过；要跑就显式 `-m e2e`
         （命令行上的 -m 排在 addopts 之后，会覆盖它）。
